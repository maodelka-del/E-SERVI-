openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: E-SERVICES marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: categories
  - name: services
  - name: orders
  - name: payments
  - name: reviews
  - name: messages
  - name: notifications
  - name: admin
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # USERS
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/become-freelancer:
    post:
      operationId: becomeFreelancer
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreelancerProfileInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreelancerProfile"

  /users/{id}/freelancer-profile:
    get:
      operationId: getFreelancerProfile
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreelancerProfile"

  /users/top-freelancers:
    get:
      operationId: getTopFreelancers
      tags: [users]
      summary: Get top rated freelancers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FreelancerProfile"

  # CATEGORIES
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    patch:
      operationId: updateCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: No content

  # SERVICES
  /services:
    get:
      operationId: listServices
      tags: [services]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
    post:
      operationId: createService
      tags: [services]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /services/featured:
    get:
      operationId: getFeaturedServices
      tags: [services]
      summary: Get featured/popular services
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    patch:
      operationId: updateService
      tags: [services]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: No content

  /services/{id}/favorite:
    post:
      operationId: toggleFavorite
      tags: [services]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStatus"

  /services/my:
    get:
      operationId: getMyServices
      tags: [services]
      summary: Get services for the logged-in freelancer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/favorites:
    get:
      operationId: listFavorites
      tags: [services]
      summary: List favorited services for current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  # ORDERS
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/deliver:
    post:
      operationId: deliverOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/accept:
    post:
      operationId: acceptDelivery
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/request-revision:
    post:
      operationId: requestRevision
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/stats:
    get:
      operationId: getOrderStats
      tags: [orders]
      summary: Get order statistics for dashboard
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStats"

  # PAYMENTS
  /payments/checkout:
    post:
      operationId: createCheckout
      tags: [payments]
      summary: Create a DiamoPay payment link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

  /payments/webhook:
    post:
      operationId: paymentWebhook
      tags: [payments]
      summary: DiamoPay webhook handler
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"

  /payments/{orderId}:
    get:
      operationId: getPayment
      tags: [payments]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  # REVIEWS
  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/service/{serviceId}:
    get:
      operationId: listServiceReviews
      tags: [reviews]
      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /reviews/freelancer/{freelancerId}:
    get:
      operationId: listFreelancerReviews
      tags: [reviews]
      parameters:
        - name: freelancerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  # MESSAGES
  /messages/{orderId}:
    get:
      operationId: listMessages
      tags: [messages]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # NOTIFICATIONS
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ADMIN
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Platform-wide statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{id}/ban:
    post:
      operationId: adminBanUser
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/services:
    get:
      operationId: adminListServices
      tags: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /admin/services/{id}/approve:
    post:
      operationId: adminApproveService
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  # STORAGE
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    # AUTH
    RegisterInput:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string }
        password: { type: string, minLength: 6 }
        role: { type: string }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"

    # USER
    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        isVerified: { type: boolean }
        isBanned: { type: boolean }
        createdAt: { type: string }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        bio: { type: string }
        location: { type: string }
        phone: { type: string }
        avatarUrl: { type: string }

    FreelancerProfile:
      type: object
      required: [id, userId, level, totalEarnings, completedOrders, rating, reviewCount, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        level: { type: string }
        skills: { type: string }
        totalEarnings: { type: number }
        completedOrders: { type: integer }
        rating: { type: number }
        reviewCount: { type: integer }
        isAvailable: { type: boolean }
        createdAt: { type: string }
        user:
          $ref: "#/components/schemas/User"

    FreelancerProfileInput:
      type: object
      required: [skills]
      properties:
        skills: { type: string }
        bio: { type: string }

    # CATEGORY
    Category:
      type: object
      required: [id, name, slug, icon, serviceCount]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        icon: { type: string }
        description: { type: ["string", "null"] }
        serviceCount: { type: integer }

    CategoryInput:
      type: object
      required: [name, icon]
      properties:
        name: { type: string }
        icon: { type: string }
        description: { type: string }

    CategoryUpdate:
      type: object
      properties:
        name: { type: string }
        icon: { type: string }
        description: { type: string }

    # SERVICE
    Service:
      type: object
      required: [id, title, description, price, deliveryDays, categoryId, freelancerId, status, orderCount, rating, reviewCount, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        price: { type: number }
        deliveryDays: { type: integer }
        categoryId: { type: integer }
        freelancerId: { type: integer }
        imageUrl: { type: ["string", "null"] }
        tags: { type: ["string", "null"] }
        status: { type: string }
        orderCount: { type: integer }
        rating: { type: number }
        reviewCount: { type: integer }
        isFeatured: { type: boolean }
        createdAt: { type: string }
        category:
          $ref: "#/components/schemas/Category"
        freelancer:
          $ref: "#/components/schemas/FreelancerProfile"

    ServiceInput:
      type: object
      required: [title, description, price, deliveryDays, categoryId]
      properties:
        title: { type: string }
        description: { type: string }
        price: { type: number }
        deliveryDays: { type: integer }
        categoryId: { type: integer }
        imageUrl: { type: string }
        tags: { type: string }

    ServiceUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        price: { type: number }
        deliveryDays: { type: integer }
        categoryId: { type: integer }
        imageUrl: { type: string }
        tags: { type: string }
        status: { type: string }

    ServiceListResponse:
      type: object
      required: [services, total, page, limit]
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    FavoriteStatus:
      type: object
      required: [isFavorited]
      properties:
        isFavorited: { type: boolean }

    # ORDER
    Order:
      type: object
      required: [id, serviceId, clientId, freelancerId, status, amount, commission, freelancerAmount, description, deliveryDays, deadline, createdAt]
      properties:
        id: { type: integer }
        serviceId: { type: integer }
        clientId: { type: integer }
        freelancerId: { type: integer }
        status: { type: string }
        amount: { type: number }
        commission: { type: number }
        freelancerAmount: { type: number }
        description: { type: string }
        attachmentUrl: { type: ["string", "null"] }
        deliveryUrl: { type: ["string", "null"] }
        deliveryDays: { type: integer }
        deadline: { type: string }
        revisionNote: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        service:
          $ref: "#/components/schemas/Service"
        client:
          $ref: "#/components/schemas/User"
        freelancer:
          $ref: "#/components/schemas/FreelancerProfile"

    OrderInput:
      type: object
      required: [serviceId, description]
      properties:
        serviceId: { type: integer }
        description: { type: string }
        attachmentUrl: { type: string }

    DeliveryInput:
      type: object
      required: [deliveryUrl]
      properties:
        deliveryUrl: { type: string }
        note: { type: string }

    RevisionInput:
      type: object
      required: [note]
      properties:
        note: { type: string }

    OrderStats:
      type: object
      required: [totalOrders, pendingOrders, inProgressOrders, completedOrders, cancelledOrders, totalRevenue]
      properties:
        totalOrders: { type: integer }
        pendingOrders: { type: integer }
        inProgressOrders: { type: integer }
        completedOrders: { type: integer }
        cancelledOrders: { type: integer }
        totalRevenue: { type: number }

    # PAYMENT
    CheckoutInput:
      type: object
      required: [orderId]
      properties:
        orderId: { type: integer }

    CheckoutResponse:
      type: object
      required: [paymentUrl, reference]
      properties:
        paymentUrl: { type: string }
        reference: { type: string }

    Payment:
      type: object
      required: [id, orderId, amount, status, reference, createdAt]
      properties:
        id: { type: integer }
        orderId: { type: integer }
        amount: { type: number }
        status: { type: string }
        reference: { type: string }
        provider: { type: string }
        createdAt: { type: string }

    WebhookResponse:
      type: object
      required: [received]
      properties:
        received: { type: boolean }

    # REVIEW
    Review:
      type: object
      required: [id, orderId, serviceId, clientId, freelancerId, rating, comment, createdAt]
      properties:
        id: { type: integer }
        orderId: { type: integer }
        serviceId: { type: integer }
        clientId: { type: integer }
        freelancerId: { type: integer }
        rating: { type: integer }
        comment: { type: string }
        createdAt: { type: string }
        client:
          $ref: "#/components/schemas/User"

    ReviewInput:
      type: object
      required: [orderId, rating, comment]
      properties:
        orderId: { type: integer }
        rating: { type: integer }
        comment: { type: string }

    # MESSAGE
    Message:
      type: object
      required: [id, orderId, senderId, content, createdAt]
      properties:
        id: { type: integer }
        orderId: { type: integer }
        senderId: { type: integer }
        content: { type: string }
        attachmentUrl: { type: ["string", "null"] }
        createdAt: { type: string }
        sender:
          $ref: "#/components/schemas/User"

    MessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string }
        attachmentUrl: { type: string }

    # NOTIFICATION
    Notification:
      type: object
      required: [id, userId, type, title, body, isRead, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        link: { type: ["string", "null"] }
        isRead: { type: boolean }
        createdAt: { type: string }

    # ADMIN
    AdminStats:
      type: object
      required: [totalUsers, totalFreelancers, totalServices, totalOrders, totalRevenue, platformCommission, pendingOrders, completedOrders]
      properties:
        totalUsers: { type: integer }
        totalFreelancers: { type: integer }
        totalServices: { type: integer }
        totalOrders: { type: integer }
        totalRevenue: { type: number }
        platformCommission: { type: number }
        pendingOrders: { type: integer }
        completedOrders: { type: integer }

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    # STORAGE
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
